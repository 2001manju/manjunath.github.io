
.project-card {
    background: #151f32;
    border: 1px solid #263247;
    border-radius: 10px;
    padding: 24px;
}

.project-card h3 {
    margin-bottom: 10px;
    color: #60a5fa;
}

.project-card p {
    color: #aab5c5;
    margin-bottom: 10px;
}

.project-card a {
    display: inline-block;
    margin-top: 10px;
}
